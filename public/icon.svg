    <path d="M12 28c0-10 6-16 16-16" stroke="#9ad5cd" stroke-width="2.5" opacity=".5"/>
    <path d="M14 28c0-8.5 5-14.5 14-14.5" stroke="#9ad5cd" stroke-width="2.5" opacity=".7"/>
    <path d="M16 28c0-7 4.5-12.5 12-12.5" stroke="#c8dfcf" stroke-width="2.5"/>
